# yaml-language-server: $schema=https://dv-flow.github.io/flow.dv.schema.json
package:
  name: fw-hdl-spec

  tasks:
  # The SV API: fw_hdl_pkg, declarations only. A tool compiles the API's
  # fw_hdl_api.svh into its own fw_hdl_pkg with its own bodies.
  - export: sv-api
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: bindings/sv
      include:
      - fw_hdl_pkg.sv
      incdirs:
      - .

  # The API with generated default bodies (tools/fw_hdl_bodies.py, an
  # sv-weave weaver): enough to compile and elaborate code written against
  # the API with no tool behind it. Outputs sv-api, then the bodies as an
  # include that fw_hdl_pkg pulls in.
  - name: sv-api-compile
    uses: svweave.Weave
    needs: [sv-api]
    with:
      config: tools/sv-weave.yaml
      verify: full

  # API smoke test: the core-layer1.md worked example, compiled and
  # elaborated against the spec's fw_hdl_pkg. Behavior is tested in each
  # tool.
  - export: smoke-src
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: tests/sv/smoke
      include:
      - smoke_pkg.sv
      - smoke_tb.sv
      incdirs:
      - .

  - name: smoke-img
    uses: hdlsim.vlt.SimImage
    needs: [sv-api-compile, smoke-src]
    with:
      top: [smoke_tb]

  - name: smoke
    uses: hdlsim.vlt.SimRun
    needs: [smoke-img]

  # M1 exit criterion: every conformance scenario's top.sv compiles against
  # fw_hdl_pkg with the default bodies (Verilator, lint only).
  - name: conformance-compile
    needs: [sv-api-compile]
    shell: bash
    run: |
      python3 $TASK_SRCDIR/tools/fw_conformance_compile.py \
          --conformance $TASK_SRCDIR/conformance --inputs $DFM_INPUTS --log-dir logs

  # Spec lint: the API has no method bodies (except the fw_rv_if bundle
  # type and the domain kinds). Needs pyslang.
  - name: spec-lint
    shell: bash
    run: |
      python3 $TASK_SRCDIR/tools/fw_api_check.py --spec $TASK_SRCDIR/bindings/sv --lint

  # Every scenario's expect.json is valid against the netlist schema, with
  # objects and diagnostics in order; meta.json has only known keys. Needs
  # jsonschema.
  - name: conformance-schema
    shell: bash
    run: |
      python3 $TASK_SRCDIR/tools/fw_conformance_schema.py --spec $TASK_SRCDIR

  - name: tests
    needs: [smoke, conformance-compile, conformance-schema, spec-lint]
